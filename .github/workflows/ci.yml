name: CI

# On every pull request and every push to main: checks, visual tests, walkthroughs against the deployed
# preview (or staging), then one published report with videos, linked from the PR (phase 1b).

on:
  pull_request:
    # ready_for_review too: marking a phase's pull request ready runs the milestone gate (docs:check --milestone).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; let every main run finish so each merge gets its report.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Test the commit that was pushed, not GitHub's temporary merge commit.
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The deploy's build (deploy.ts; it was Cloudflare's own until 13 Nov 2026), on this fresh checkout and before
      # anything else builds a package: only the web app's build task, then the Worker bundled. It failed unseen from
      # phase 1d step 4 to step 11, when the Worker started bundling packages that task didn't build.
      - name: The deploy's build, on a fresh checkout
        run: |
          pnpm build --filter=@flowcanvas/web
          pnpm exec wrangler versions upload --dry-run
        env:
          FLOWCANVAS_COMMIT: ${{ env.COMMIT }}
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Web bundle within its budget
        run: pnpm --filter @flowcanvas/web size
      # The pinned test repos: public forks, commits on their branches, licences unchanged (corpus/manifest.json).
      - run: pnpm corpus:check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The living docs held to the code: release, progress, counts, phases still to come, paths, packages (phase 7).
      # A pull request ready for review (a phase closing) also passes the milestone gate: every living doc re-read at
      # this milestone, every step written up in full, every commit named in build-steps (owner, 13 Nov 2026).
      - name: Docs held to the code (and the milestone gate, once ready for review)
        env:
          READY: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
        run: |
          if [ "$READY" = true ]; then
            # The checkout is one commit deep: the gate needs the branch's history back to main.
            git fetch --quiet --unshallow origin +refs/heads/main:refs/remotes/origin/main
            pnpm docs:milestone
          else
            pnpm docs:check
          fi

  docker:
    # Not a required check. Split into parallel shards (owner, 13 Nov 2026): the corpus test was 8½ of the job's 9
    # minutes, most of it the three largest projects. Each large project gets its own runner; the `rest` shard runs
    # every other Docker test and every other project (CORPUS_EXCEPT), so a project added later is still tested.
    name: Workspaces against real Docker (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # One shard failing doesn't hide what the others found.
      fail-fast: false
      matrix:
        include:
          - shard: rest
            except: twenty,medusa,librechat
          - shard: twenty
            only: twenty
          - shard: medusa
            only: medusa
          - shard: librechat
            only: librechat
    env:
      # A runner isn't the owner's laptop: its small disk would read as pressure and refuse every workspace.
      # Only test hosts (fc-test- prefixes) accept this; the guard's own tests still run in `pnpm test`.
      WORKSPACE_HOST_TEST_PRESSURE: none
      CORPUS_ONLY: ${{ matrix.only }}
      CORPUS_EXCEPT: ${{ matrix.except }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      # The isolated gateway mode (ADR 0016) needs Docker 28 or newer; the tests check it too.
      - name: Docker version
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          major="$(docker version --format '{{.Server.Version}}' | cut -d. -f1)"
          [ "$major" -ge 28 ] || { echo "Workspaces need Docker 28 or newer"; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Isolation, the egress allowlist, clone time, sleep and resume, the guard, no secrets kept, and the corpus.
      - if: ${{ matrix.shard == 'rest' }}
        run: pnpm test:docker
      # A large project's shard: only the corpus test, for that project.
      - if: ${{ matrix.shard != 'rest' }}
        run: |
          pnpm turbo run build --filter='@flowcanvas/workspace-host^...'
          pnpm --filter @flowcanvas/workspace-host exec vitest run src/corpus.docker.test.ts

  perf:
    name: Canvas performance (headless, regressions only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The same browser image as the visual job. Headless means software rendering, so this job only catches large
    # regressions; real smoothness is measured on a laptop with its GPU (PERF_REAL=1, phase 2 step 7).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:perf
        env:
          FLOWCANVAS_COMMIT: ${{ env.COMMIT }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: canvas-perf
          path: e2e/reports-data/canvas-perf.json
          retention-days: 14

  visual:
    # This name is a required check in main's ruleset: renaming it blocks every merge until the ruleset changes
    # too. It covers the screens as well since phase 2.
    name: Visual and accessibility (catalogue)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Same image as `pnpm test:visual` on every machine, so the approved screenshots match (ADR 0012).
    # Keep the tag equal to @playwright/test in pnpm-workspace.yaml (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    env:
      FLOWCANVAS_IN_PLAYWRIGHT_IMAGE: 1
      # Whether CI can deploy the catalogue (a fork's pull request has no secrets); the token stays in its step.
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - name: Image matches the Playwright version
        run: |
          expected="v$(sed -n "s/^  '@playwright\/test': //p" pnpm-workspace.yaml)-noble"
          grep -q "mcr.microsoft.com/playwright:${expected}" .github/workflows/ci.yml \
            || { echo "Update the container image in ci.yml to playwright:${expected}"; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:visual
      # The catalogue just built and checked: as the branch's preview, or staging from main (owner, 13 Nov 2026; it
      # was Cloudflare's own build). Only once its checks pass.
      - name: Deploy the catalogue (preview, or staging from main)
        if: ${{ env.CAN_DEPLOY == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node e2e/scripts/deploy.ts --worker catalogue --to preview --branch "$HEAD_REF" --commit "$COMMIT"
          else
            node e2e/scripts/deploy.ts --worker catalogue --to staging --commit "$COMMIT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: report-visual
          path: |
            e2e/playwright-report-visual/
            e2e/reports-data/visual.json
          retention-days: 14

  walkthroughs:
    name: Walkthroughs (try-it) on the deployed app
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Whether CI can deploy the preview (a fork's pull request has no secrets); the token itself stays in its step.
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI deploys this exact commit (owner, 13 Nov 2026): a pull request's preview, and staging from main. Cloudflare's
      # GitHub app dropped some pushes, and the walkthroughs waited for builds that never came. A fork's pull request
      # has no secrets: it gets no preview from CI, and its walkthroughs wait for one and fail (said in the log).
      - name: Deploy this commit (preview, or staging from main)
        if: ${{ env.CAN_DEPLOY == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLOWCANVAS_COMMIT: ${{ env.COMMIT }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          pnpm build --filter=@flowcanvas/web
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node e2e/scripts/deploy.ts --worker app --to preview --branch "$HEAD_REF" --commit "$COMMIT"
          else
            node e2e/scripts/deploy.ts --worker app --to staging --commit "$COMMIT"
          fi
      # Then wait until the preview (PRs) or staging (main) serves this exact commit: within seconds once deployed,
      # so fail in 3 minutes, not 10.
      - name: Wait for the deployment of this commit
        id: deploy
        working-directory: e2e
        env:
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$CAN_DEPLOY" != true ]; then
            echo "No Cloudflare token here (a fork's pull request?): CI didn't deploy, so there may be no preview to test."
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/wait-for-deploy.ts --branch "$HEAD_REF" --commit "$COMMIT" --timeout 180
          else
            node scripts/wait-for-deploy.ts --url "https://flowcanvas.${CLOUDFLARE_WORKERS_SUBDOMAIN}.workers.dev/" --commit "$COMMIT" --timeout 180
          fi
      - name: Walkthroughs
        run: pnpm --filter @flowcanvas/e2e test:e2e
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          E2E_EXPECTED_COMMIT: ${{ env.COMMIT }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: report-walkthroughs
          path: |
            e2e/playwright-report/
            e2e/reports-data/walkthroughs.json
          retention-days: 14

  publish:
    name: Publish report and comment
    needs: [visual, walkthroughs]
    # Also after failures, so a failing run still gets a report; never for cancelled runs.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          path: e2e
          merge-multiple: true
      # Secrets aren't available to pull requests from forks; skip publishing there instead of failing.
      - name: Publish the report
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: e2e
        env:
          PREVIEW_URL: ${{ needs.walkthroughs.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            pnpm publish-report --alias "pr-$PR_NUMBER"
          else
            pnpm publish-report --alias main --production
          fi
      - name: Comment on the pull request
        if: ${{ github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file e2e/reports-data/comment.md
