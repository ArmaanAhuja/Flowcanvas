name: CI

# A trimmed safety net (owner, 21 Nov 2026): on every pull request push, lint, typecheck, unit tests and the build;
# the walkthroughs, the catalogue's accessibility check and canvas performance only when the web app or its packages
# changed; the Docker corpus only when the engine, connectors or workspace changed. Everything on a push to main.
# Then one published report with videos, linked from the PR (phase 1b). Skipped jobs count as passed checks.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; let every main run finish so each merge gets its report.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Test the commit that was pushed, not GitHub's temporary merge commit.
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.diff.outputs.web }}
      engine: ${{ steps.diff.outputs.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo web=true >> "$GITHUB_OUTPUT"
            echo engine=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE...$COMMIT")"
          echo "$files"
          # Shared files (dependencies, CI itself) count for both.
          shared='^(pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|turbo\.json|\.github/)'
          web="$shared|^(apps/|packages/(ui|tokens|graph-model)/|packages/engine/src/protocol|services/|e2e/)"
          engine="$shared|^(packages/(engine|connectors|graph-model)/|workspace/|corpus/)"
          echo "web=$(echo "$files" | grep -Eq "$web" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "engine=$(echo "$files" | grep -Eq "$engine" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The deploy's build (deploy.ts; it was Cloudflare's own until 13 Nov 2026), on this fresh checkout and before
      # anything else builds a package: only the web app's build task, then the Worker bundled. It failed unseen from
      # phase 1d step 4 to step 11, when the Worker started bundling packages that task didn't build.
      - name: The deploy's build, on a fresh checkout
        run: |
          pnpm build --filter=@flowcanvas/web
          pnpm exec wrangler versions upload --dry-run
        env:
          FLOWCANVAS_COMMIT: ${{ env.COMMIT }}
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Web bundle within its budget
        run: pnpm --filter @flowcanvas/web size
      # The pinned test repos: public forks, commits on their branches, licences unchanged (corpus/manifest.json).
      - run: pnpm corpus:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  docker:
    # Not a required check. Split into parallel shards (owner, 13 Nov 2026): the corpus test was 8½ of the job's 9
    # minutes, most of it the three largest projects. Each large project gets its own runner; the `rest` shard runs
    # every other Docker test and every other project (CORPUS_EXCEPT), so a project added later is still tested.
    name: Workspaces against real Docker (${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.engine == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # One shard failing doesn't hide what the others found.
      fail-fast: false
      matrix:
        include:
          - shard: rest
            except: twenty,medusa,librechat
          - shard: twenty
            only: twenty
          - shard: medusa
            only: medusa
          - shard: librechat
            only: librechat
    env:
      # A runner isn't the owner's laptop: its small disk would read as pressure and refuse every workspace.
      # Only test hosts (fc-test- prefixes) accept this; the guard's own tests still run in `pnpm test`.
      WORKSPACE_HOST_TEST_PRESSURE: none
      CORPUS_ONLY: ${{ matrix.only }}
      CORPUS_EXCEPT: ${{ matrix.except }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      # The isolated gateway mode (ADR 0016) needs Docker 28 or newer; the tests check it too.
      - name: Docker version
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          major="$(docker version --format '{{.Server.Version}}' | cut -d. -f1)"
          [ "$major" -ge 28 ] || { echo "Workspaces need Docker 28 or newer"; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Isolation, the egress allowlist, clone time, sleep and resume, the guard, no secrets kept, and the corpus.
      - if: ${{ matrix.shard == 'rest' }}
        run: pnpm test:docker
      # A large project's shard: only the corpus test, for that project.
      - if: ${{ matrix.shard != 'rest' }}
        run: |
          pnpm turbo run build --filter='@flowcanvas/workspace-host^...'
          pnpm --filter @flowcanvas/workspace-host exec vitest run src/corpus.docker.test.ts

  desktop:
    # Not a required check. The desktop app (build plan v2, phase 1): the walkthrough in the real Electron app on
    # Rallly, then both Linux packages built, the .deb installed on this clean Ubuntu and smoke-tested there.
    name: Desktop app (Linux packages)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.engine == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 stops unprivileged user namespaces, which Electron's sandbox needs when run from node_modules
      # (an installed .deb sets up its own sandbox helper instead). Also a virtual display for the windows.
      - name: Let Electron's sandbox start; a virtual display
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -q
          sudo apt-get install -yq xvfb
      - run: pnpm build
      - run: pnpm corpus:fetch rallly
      - name: The walkthrough in the real app
        run: xvfb-run -a pnpm --filter @flowcanvas/e2e test:desktop
      - name: Package (AppImage and .deb)
        run: pnpm --filter @flowcanvas/desktop package
      - name: Install the .deb on this clean Ubuntu, and smoke-test the installed app on Rallly
        run: |
          sudo apt-get install -yq ./apps/desktop/release/flowcanvas_*_amd64.deb
          rallly="$(ls -d ~/.cache/flowcanvas/corpus/rallly@*)"
          git clone --quiet --shared "$rallly" "$RUNNER_TEMP/rallly"
          xvfb-run -a flowcanvas --smoke-test "$RUNNER_TEMP/rallly"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: desktop-linux
          path: |
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
            e2e/playwright-report-desktop/
          retention-days: 14

  perf:
    name: Canvas performance (headless, regressions only)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The same browser image as the visual job. Headless means software rendering, so this job only catches large
    # regressions; real smoothness is measured on a laptop with its GPU (PERF_REAL=1, phase 2 step 7).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:perf
        env:
          FLOWCANVAS_COMMIT: ${{ env.COMMIT }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: canvas-perf
          path: e2e/reports-data/canvas-perf.json
          retention-days: 14

  visual:
    # This name is a required check in main's ruleset: renaming it blocks every merge until the ruleset changes
    # too. Since 21 Nov 2026 (owner) it has no screenshots: the catalogue's accessibility check (axe), then its deploy.
    name: Visual and accessibility (catalogue)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Playwright's image for its browsers; keep the tag equal to @playwright/test in pnpm-workspace.yaml (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    env:
      # Whether CI can deploy the catalogue (a fork's pull request has no secrets); the token stays in its step.
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - name: Image matches the Playwright version
        run: |
          expected="v$(sed -n "s/^  '@playwright\/test': //p" pnpm-workspace.yaml)-noble"
          grep -q "mcr.microsoft.com/playwright:${expected}" .github/workflows/ci.yml \
            || { echo "Update the container image in ci.yml to playwright:${expected}"; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:a11y
      # The catalogue just built and checked: as the branch's preview, or staging from main (owner, 13 Nov 2026; it
      # was Cloudflare's own build). Only once its checks pass.
      - name: Deploy the catalogue (preview, or staging from main)
        if: ${{ env.CAN_DEPLOY == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node e2e/scripts/deploy.ts --worker catalogue --to preview --branch "$HEAD_REF" --commit "$COMMIT"
          else
            node e2e/scripts/deploy.ts --worker catalogue --to staging --commit "$COMMIT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: report-a11y
          path: |
            e2e/playwright-report-a11y/
            e2e/reports-data/a11y.json
          retention-days: 14

  walkthroughs:
    name: Walkthroughs (try-it) on the deployed app
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Whether CI can deploy the preview (a fork's pull request has no secrets); the token itself stays in its step.
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI deploys this exact commit (owner, 13 Nov 2026): a pull request's preview, and staging from main. Cloudflare's
      # GitHub app dropped some pushes, and the walkthroughs waited for builds that never came. A fork's pull request
      # has no secrets: it gets no preview from CI, and its walkthroughs wait for one and fail (said in the log).
      - name: Deploy this commit (preview, or staging from main)
        if: ${{ env.CAN_DEPLOY == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLOWCANVAS_COMMIT: ${{ env.COMMIT }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          pnpm build --filter=@flowcanvas/web
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node e2e/scripts/deploy.ts --worker app --to preview --branch "$HEAD_REF" --commit "$COMMIT"
          else
            node e2e/scripts/deploy.ts --worker app --to staging --commit "$COMMIT"
          fi
      # Then wait until the preview (PRs) or staging (main) serves this exact commit: within seconds once deployed,
      # so fail in 3 minutes, not 10.
      - name: Wait for the deployment of this commit
        id: deploy
        working-directory: e2e
        env:
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$CAN_DEPLOY" != true ]; then
            echo "No Cloudflare token here (a fork's pull request?): CI didn't deploy, so there may be no preview to test."
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/wait-for-deploy.ts --branch "$HEAD_REF" --commit "$COMMIT" --timeout 180
          else
            node scripts/wait-for-deploy.ts --url "https://flowcanvas.${CLOUDFLARE_WORKERS_SUBDOMAIN}.workers.dev/" --commit "$COMMIT" --timeout 180
          fi
      - name: Walkthroughs
        run: pnpm --filter @flowcanvas/e2e test:e2e
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          E2E_EXPECTED_COMMIT: ${{ env.COMMIT }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: report-walkthroughs
          path: |
            e2e/playwright-report/
            e2e/reports-data/walkthroughs.json
          retention-days: 14

  publish:
    name: Publish report and comment
    needs: [visual, walkthroughs]
    # Also after failures, so a failing run still gets a report; never for cancelled runs, nor when neither ran.
    if: ${{ !cancelled() && (needs.visual.result != 'skipped' || needs.walkthroughs.result != 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          path: e2e
          merge-multiple: true
      # Secrets aren't available to pull requests from forks; skip publishing there instead of failing.
      - name: Publish the report
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: e2e
        env:
          PREVIEW_URL: ${{ needs.walkthroughs.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            pnpm publish-report --alias "pr-$PR_NUMBER"
          else
            pnpm publish-report --alias main --production
          fi
      - name: Comment on the pull request
        if: ${{ github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file e2e/reports-data/comment.md
