allowBuilds:
  esbuild: false
  # The grammars' install scripts build native Node bindings we don't use: the engine loads their
  # ready-made .wasm files with web-tree-sitter (ADR 0023).
  tree-sitter-css: false
  tree-sitter-html: false
  tree-sitter-javascript: false
  tree-sitter-json: false
  tree-sitter-typescript: false
  workerd: false
